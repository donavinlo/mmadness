name: CI

on:
  push:
  pull_request:

jobs:
  lint-ruff:
    name: Ruff Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv uv-nox
      - name: Sync lint group
        run: |
          uv sync --group lint
      - name: Run ruff
        run: uv run --group lint ruff check .

  lint-pylint:
    name: Pylint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv uv-nox
      - name: Sync lint group
        run: |
          uv sync --group lint
      - name: Run pylint
        run: uv run --group lint pylint src tests

  test-3.10:
    name: Tests (3.10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv uv-nox
      - name: Sync test group
        run: uv sync --group test
      - name: Run tests
        run: uv run --group test pytest -q

  test-3.11:
    name: Tests (3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv uv-nox
      - name: Sync test group
        run: uv sync --group test
      - name: Run tests
        run: uv run --group test pytest -q

  test-3.12:
    name: Tests (3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv uv-nox
      - name: Sync test group
        run: uv sync --group test
      - name: Run tests
        run: uv run --group test pytest -q
